name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免连续推送时排队浪费 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP 语法检查 (7.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 不用 container: php:7.4-cli —— 该镜像基于 Debian 11 (glibc 2.31)，
      # 新版 action 的 Node 运行时可能要求更高 glibc 而报 GLIBC_2.34 not found。
      # 在原生 runner 上装 PHP 7.4，版本与 Dockerfile 一致且无兼容风险。
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: php -l 全量扫描
        run: |
          set -uo pipefail
          fail=0
          # 排除第三方依赖：includes/vendor 由 composer 生成，不属于本仓库维护范围
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=${f#./}::${out}"
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
                     -not -path './includes/vendor/*' \
                     -not -path './.git/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "存在语法错误，请见上方 error 注解"
            exit 1
          fi
          echo "语法检查通过"

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 web 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          # 仅验证可构建，不推送镜像仓库
          push: false
          load: true
          tags: epay-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 PHP 扩展齐全
        run: |
          set -euo pipefail
          exts=$(docker run --rm epay-web:ci php -m)
          echo "$exts"
          # 用换行分隔而非空格，因为 "Zend OPcache" 扩展名本身含空格
          missing=0
          while IFS= read -r e; do
            [ -z "$e" ] && continue
            if ! grep -qix -- "$e" <<<"$exts"; then
              echo "::error::缺少 PHP 扩展: $e"
              missing=1
            fi
          done <<'EXPECTED'
          gd
          pdo_mysql
          mysqli
          bcmath
          zip
          Zend OPcache
          EXPECTED
          [ "$missing" -eq 0 ] || exit 1
          echo "扩展检查通过"

  compose-smoke:
    name: Compose 端到端冒烟
    runs-on: ubuntu-latest
    needs: [php-lint, docker-build]

    steps:
      - uses: actions/checkout@v4

      - name: 启动容器栈
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: 等待 web 就绪并访问安装页
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/ || true)
            # 未安装时入口会 302 跳转到 install/，2xx 与 3xx 均视为存活
            if [[ "$code" =~ ^(2|3)[0-9][0-9]$ ]]; then
              echo "web 就绪，HTTP $code"
              curl -s -o /dev/null -w '安装页 HTTP %{http_code}\n' http://localhost:8090/install/
              exit 0
            fi
            sleep 3
          done
          echo "::error::web 未在 90s 内就绪，最后状态码 ${code:-无响应}"
          docker compose -f docker/docker-compose.yml logs --tail=80
          exit 1

      - name: 校验数据库连通
        run: |
          docker compose -f docker/docker-compose.yml exec -T db \
            mariadb -uepay -pepay123456 epay -e 'SELECT 1;'

      - name: 失败时输出日志
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=200

      - name: 清理
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
